<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Jump</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="game-board">
        <img src="images/clouds.png" class="clouds">
        <img src="images/mario.gif" class="mario">
        <img src="images/pipe.png" class="pipe">

        <div id="pontuacao" class="pontuacao">0</div>

        <div id="playAgain" class="play-again hidden">
            <p>Game Over</p>
            <p>Pressione qualquer tecla ou toque aqui para jogar novamente</p>
        </div>
    </div>

    <p class="instrucoes">
        Pressione Espaço, ↑ ou W, ou toque no cenário para pular.
    </p>
</body>
</html>
